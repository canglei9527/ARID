<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARID 双模型执行配置</title>
<style>
  /* 现代简洁，系统字体，无外部资源，跟随系统深浅色 */
  :root {
    --bg: #f6f7f9;
    --fg: #1c2024;
    --muted: #6b7280;
    --card: #ffffff;
    --border: #e2e5ea;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --danger: #dc2626;
    --ok: #16a34a;
    --warn-bg: #fef3c7;
    --warn-fg: #92400e;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --card: #171a20;
      --border: #2a2f38;
      --accent: #3b82f6;
      --warn-bg: #3b2f14;
      --warn-fg: #fbbf24;
      --shadow: 0 1px 4px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
      "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.55;
  }
  header {
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  main { max-width: 860px; margin: 22px auto 60px; padding: 0 16px; display: grid; gap: 16px; }
  .statusbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; box-shadow: var(--shadow);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.err { background: var(--danger); }
  .dot.link { background: var(--muted); }
  .sep { opacity: .5; }
  .pathcell { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .note { color: var(--muted); font-size: 12.5px; width: 100%; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], select {
    width: 100%; padding: 8px 10px; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--fg);
  }
  .readonly {
    background: transparent; border: 1px dashed var(--border); color: var(--muted);
  }
  button {
    border: none; border-radius: 8px; padding: 8px 14px; font-size: 13.5px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  button.small { padding: 4px 10px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .result { margin-top: 10px; font-size: 13px; min-height: 20px; }
  .result.okr { color: var(--ok); }
  .result.errr { color: var(--danger); }
  .result.war { color: var(--warn-fg); }
  .backup-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 4px;
    border-bottom: 1px solid var(--border); font-size: 13px; flex-wrap: wrap;
  }
  .backup-item:last-child { border-bottom: none; }
  .bkind { font-size: 11px; padding: 1px 8px; border-radius: 999px; flex: none; }
  .bkind.initial { background: #dbeafe; color: #1d4ed8; }
  .bkind.auto { background: #dcfce7; color: #166534; }
  .bkind.manual { background: #fef3c7; color: #92400e; }
  @media (prefers-color-scheme: dark) {
    .bkind.initial { background: #1e3a5f; color: #93c5fd; }
    .bkind.auto { background: #14532d; color: #86efac; }
    .bkind.manual { background: #3b2f14; color: #fcd34d; }
  }
  .bmeta { color: var(--muted); font-size: 12px; margin-left: auto; }
  .bop { display: flex; gap: 6px; }
  .btext { margin-top: 8px; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; white-space: pre-wrap; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; max-height: 260px; overflow: auto; }
  .empty { color: var(--muted); font-size: 13px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 460px; width: 92%; }
  .modal p { margin: 0 0 4px; font-size: 14px; }
  .modal .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
  .modal .row { justify-content: flex-end; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>ARID 双模型执行配置</h1>
</header>
<main>
  <div class="statusbar">
    <span class="dot" id="healthDot"></span>
    <span id="healthText">连接检测中…</span>
    <span class="sep">·</span>
    <span>设置文件</span>
    <span class="pathcell" id="settingsPath"></span>
    <div class="note">
      保存后 DSH 约 100ms 内热重载，下次执行任务即用新模型；配置持久化，重启不丢。
    </div>
  </div>

  <section id="executorCard" class="card">
    <h2>执行模型 <span class="badge">arid-dual-model.executor</span></h2>
    <div class="field">
      <label for="execProv">Provider</label>
      <input type="text" id="execProv" list="provProviders" placeholder="例如 opencode-go" autocomplete="off">
      <datalist id="provProviders"></datalist>
    </div>
    <div class="field">
      <label for="execModel">Model</label>
      <input type="text" id="execModel" list="modelSuggest" placeholder="例如 deepseek-v4-flash" autocomplete="off">
      <datalist id="modelSuggest"></datalist>
    </div>
    <div class="field">
      <label>当前生效值（只读）</label>
      <div class="row">
        <input type="text" class="readonly" id="execCurrent" readonly value="—">
      </div>
    </div>
    <div class="row">
      <button id="saveBtn">保存</button>
      <span class="hint">写入的是 provider 与 model 两个叶子，其余配置及注释原样保留。</span>
    </div>
    <div class="result" id="execResult"></div>
  </section>

  <section class="card">
    <h2>规划模型 <span class="badge">只读 · agent-default-model</span></h2>
    <div class="field">
      <input type="text" class="readonly" id="plannerCurrent" readonly value="—">
    </div>
    <div class="hint">规划模型在工作台 composer 底部模型选择位，或到 DSH 设置中修改；本工具只管理执行模型。</div>
  </section>

  <section class="card">
    <h2>备份 <span class="badge">settings-backups</span></h2>
    <div class="row">
      <button id="manualBackupBtn" class="secondary">手动创建备份</button>
      <span class="hint">每次保存或恢复前都会先自动备份一份；初始备份在首次启动时自动生成。</span>
    </div>
    <div class="result" id="backupHint"></div>
    <div id="backupList" style="margin-top: 10px;"></div>
  </section>
</main>

<div class="modal-mask hidden" id="modalMask">
  <div class="modal">
    <p id="modalTitle"></p>
    <p class="sub" id="modalBody"></p>
    <div class="row">
      <button class="secondary" id="modalCancel">取消</button>
      <button class="danger" id="modalOk">确认</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var modal = { onConfirm: null };
  var lastData = { executor: null, planner: null, providers: [], backups: [] };
  var historyKey = 'dmg:model-history'; // localStorage 记录历史模型

  var $ = function (id) { return document.getElementById(id); };

  // ---- 通用请求 ----
  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    }).then(function (res) {
      return res.json().catch(function () { return { ok: false, error: '响应不是合法 JSON' }; })
        .then(function (data) { if (res.ok) data._ok = true; return data; });
    });
  }

  // ---- 顶部状态 ----
  function paintHealth(ok) {
    $('healthDot').className = 'dot ' + (ok ? 'ok' : 'err');
    $('healthText').textContent = ok ? '服务已连接' : '连接断开';
  }
  function ping() {
    fetch('/api/health').then(function (r) { return r.json(); })
      .then(function () { paintHealth(true); })
      .catch(function () { paintHealth(false); });
  }

  // ---- 状态加载 ----
  function rememberModel(m) {
    if (!m) return;
    try {
      var arr = JSON.parse(localStorage.getItem(historyKey) || '[]');
      if (arr.indexOf(m) === -1) arr.push(m);
      localStorage.setItem(historyKey, JSON.stringify(arr.slice(0, 10)));
    } catch (e) { /* ignore */ }
  }
  function fillDatalist() {
    var dl = $('provProviders');
    dl.innerHTML = '';
    (lastData.providers || []).forEach(function (p) {
      var o = document.createElement('option'); o.value = p; dl.appendChild(o);
    });
    var mdl = $('modelSuggest');
    mdl.innerHTML = '';
    var seen = {};
    ['deepseek-v4-flash'].concat((function () {
      try { return JSON.parse(localStorage.getItem(historyKey) || '[]'); } catch (e) { return []; }
    })()).forEach(function (m) {
      if (!m || seen[m]) return; seen[m] = true;
      var o = document.createElement('option'); o.value = m; mdl.appendChild(o);
    });
  }
  function renderBackups(backups) {
    var box = $('backupList');
    box.innerHTML = '';
    if (!backups || !backups.length) { box.innerHTML = '<div class="empty">暂无备份。</div>'; return; }
    var kindLabel = { initial: '初始', auto: '自动', manual: '手动' };
    backups.forEach(function (b) {
      var div = document.createElement('div');
      div.className = 'backup-item';
      var t = document.createElement('span');
      t.textContent = new Date(b.mtime).toLocaleString();
      var k = document.createElement('span');
      k.className = 'bkind ' + b.kind;
      k.textContent = kindLabel[b.kind] || b.kind;
      var meta = document.createElement('span');
      meta.className = 'bmeta';
      meta.textContent = fmtSize(b.size) + ' · ' + b.file;
      var ops = document.createElement('span');
      ops.className = 'bop';
      var btnPrev = mkBtn('预览', 'secondary small', function () { togglePreview(div, b.file); });
      var btnRestore = mkBtn('恢复', 'small', function () {
        confirmAction('恢复备份', '将先把当前配置自动备份，然后用「' + b.file + '」的完整内容覆盖 settings.yaml。继续？', function () {
          api('POST', '/api/restore', { file: b.file }).then(function (d) {
            if (d.ok) { show('backupHint', '已恢复为 ' + b.file + '。', 'okr'); refresh(); }
            else show('backupHint', d.error, 'errr');
          });
        });
      });
      var btnDel = mkBtn('删除', 'danger small', function () {
        confirmAction('删除备份', '确定删除备份「' + b.file + '」？' + (b.kind === 'initial' ? '\n注意：这是初始备份，删除后无法再通过它一键恢复初始配置。' : ''), function () {
          api('DELETE', '/api/backup?file=' + encodeURIComponent(b.file)).then(function (d) {
            if (d.ok) { show('backupHint', d.warning || '已删除 ' + b.file + '。', d.warning ? 'war' : 'okr'); refresh(); }
            else show('backupHint', d.error, 'errr');
          });
        });
      });
      ops.appendChild(btnPrev); ops.appendChild(btnRestore); ops.appendChild(btnDel);
      div.appendChild(t); div.appendChild(k); div.appendChild(meta); div.appendChild(ops);
      box.appendChild(div);
    });
  }
  function mkBtn(label, cls, handler) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    cls.split(' ').forEach(function (c) { if (c) b.classList.add(c); });
    b.addEventListener('click', handler);
    return b;
  }
  function togglePreview(div, file) {
    var prev = div.querySelector('.btext');
    if (prev) { prev.remove(); return; }
    fetch('/api/backup?file=' + encodeURIComponent(file))
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var p = document.createElement('div');
        p.className = 'btext';
        p.textContent = txt;
        div.appendChild(p);
      })
      .catch(function () { var p = document.createElement('div'); p.className = 'btext'; p.textContent = '读取失败'; div.appendChild(p); });
  }
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }
  function refresh() {
    return api('GET', '/api/state').then(function (d) {
      if (!d.ok) { show('execResult', d.error, 'errr'); return; }
      lastData = d;
      $('settingsPath').textContent = d.settingsPath;
      var ex = d.executor;
      $('execCurrent').value = ex ? (ex.provider + ' / ' + ex.model) : '（文件缺失或不可解析）';
      var pl = d.planner;
      $('plannerCurrent').value = pl ? (pl.provider + ' / ' + pl.model + (pl.reasoningEffort ? ' (reasoningEffort: ' + pl.reasoningEffort + ')' : '')) : '（未找到 agent-default-model）';
      if (ex) { $('execProv').value = ex.provider; $('execModel').value = ex.model; }
      fillDatalist();
      renderBackups(d.backups);
    }).catch(function () { show('execResult', '读取状态失败', 'errr'); });
  }
  function show(id, msg, cls) {
    var el = $(id);
    el.textContent = msg;
    el.className = 'result ' + (cls || '');
  }

  // ---- 保存 ----
  $('saveBtn').addEventListener('click', function () {
    var btn = $('saveBtn');
    var provider = $('execProv').value.trim();
    var model = $('execModel').value.trim();
    if (!provider || !model) { show('execResult', 'provider 与 model 都不能为空。', 'errr'); return; }
    btn.disabled = true;
    show('execResult', '保存中…');
    api('PUT', '/api/executor', { provider: provider, model: model }).then(function (d) {
      btn.disabled = false;
      if (d.ok) {
        rememberModel(model);
        if (d.changed) {
          show('execResult', '已保存。DSH 约 100ms 内热重载，下次执行任务即用新模型。' + (d.backup ? '（自动备份：' + d.backup.file + '）' : ''), 'okr');
        } else {
          show('execResult', '值与当前一致，未做任何修改。', 'okr');
        }
        refresh();
      } else {
        show('execResult', d.error || '保存失败', 'errr');
      }
    }).catch(function () { btn.disabled = false; show('execResult', '请求失败', 'errr'); });
  });

  // ---- 手动备份 ----
  $('manualBackupBtn').addEventListener('click', function () {
    api('POST', '/api/backup', { kind: 'manual' }).then(function (d) {
      if (d.ok) { show('backupHint', '已创建手动备份：' + d.file, 'okr'); refresh(); }
      else show('backupHint', d.error, 'errr');
    });
  });

  // ---- 二次确认对话框 ----
  function confirmAction(title, body, onOk) {
    $('modalTitle').textContent = title;
    $('modalBody').textContent = body;
    modal.onConfirm = onOk;
    $('modalMask').classList.remove('hidden');
  }
  $('modalCancel').addEventListener('click', function () {
    modal.onConfirm = null;
    $('modalMask').classList.add('hidden');
  });
  $('modalOk').addEventListener('click', function () {
    var fn = modal.onConfirm; modal.onConfirm = null;
    $('modalMask').classList.add('hidden');
    if (fn) fn();
  });

  // ---- 启动 ----
  ping();
  refresh();
  setInterval(ping, 10000);
})();
</script>
</body>
</html>
